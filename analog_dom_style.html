<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>인터넷활용 실습 템플릿</title>
  <link rel="stylesheet" href="style.css">
  <style>
        /* 타겟 문장을 90년대 프로그램 내부 텍스트창(음각) 스타일로 변경 */
        #target {
            font-size: 20px;
            font-weight: bold;
            padding: 20px;
            margin: 20px auto;
            width: 80%;
            background-color: #ffffff;
            color: #000000;
            text-align: center;
            
            /* 현대적인 부드러운 전환 효과(transition)와 둥근 모서리 제거 */
            border-radius: 0; 
            /* 고전 OS 특유의 안으로 파인 듯한 입체 테두리 효과 */
            border: 2px solid #000000;
            border-bottom-color: #ffffff;
            border-right-color: #ffffff;
        }
        
        /* 외부 style.css의 입체 버튼 디자인을 사용하기 위해 기존 스타일은 마진만 남기고 제거 */
        button {
            margin: 5px;
        }
    </style>
</head>
<body>
<header>
  <h1>이름: 박예인</h1>
  <p class="subtitle">한 줄 소개: 26학번</p>
</header>
<nav>
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="portfolio.html">Portfolio</a>
  <a href="contact.html">Contact</a>
</nav>
<main class="container">
<section>
    <h2>실습 1: DOM 스타일 변환기</h2>
    <p>아래 버튼을 클릭하여 타겟 문장의 스타일을 변경해보세요.</p>
    <div id="target">이 문장의 스타일이 변경됩니다!</div>
    <button onclick="changeColor()">글자색 변경</button>
    <button onclick="increaseSize()">글자 크기 변경 (+)</button>
    <button onclick="decreaseSize()">글자 크기 변경 (-)</button>
    <button onclick="changeBackground()">배경색 변경</button>
    <button onclick="toggleVisibility()">숨기기/보이기 토글</button>
    <script>
        // 1. 글자색 변경 함수 (검정색 ↔ 파란색)
        function changeColor() {
            var obj = document.getElementById("target");

         // 현재 강제로 지정된 글자색이 파란색(blue)인지 확인합니다.
            if (obj.style.color === "blue") {
        // 파란색 상태라면, 다시 검정색(black)으로 되돌립니다.
                obj.style.color = "black";
             } else {
        // 파란색이 아니라면(처음 상태이거나 다른 색이라면), 파란색으로 변경합니다.
                obj.style.color = "blue";
            }
        }

        // 2-1. 글자 크기 변경 (+) 함수 (20px ↔ 32px)
        function increaseSize() {
            var obj = document.getElementById("target");

         // 현재 강제로 지정된 글자 크기가 32px인지 확인합니다.
             if (obj.style.fontSize === "32px") {
         // 32px 상태라면, 다시 원래 크기인 20px로 되돌립니다.
                 obj.style.fontSize = "20px";
             } else {
         // 32px이 아니라면(처음 상태이거나 다른 크기라면), 32px로 커지게 합니다.
                 obj.style.fontSize = "32px";
             }
        }
    

        // 2-2. 글자 크기 변경 (-) 함수 (20px ↔ 16px)
        function decreaseSize() {
             var obj = document.getElementById("target");

         // 현재 강제로 지정된 글자 크기가 16px인지 확인합니다.
             if (obj.style.fontSize === "16px") {
       // 16px 상태라면, 다시 원래 크기인 20px로 되돌립니다.
                  obj.style.fontSize = "20px";
             } else {
        // 16px이 아니라면, 16px로 작아지게 합니다.
                  obj.style.fontSize = "16px";
             }
        }

        // 3. 배경색 변경 함수
        function changeBackground() {
            var obj = document.getElementById("target");

            if (obj.style.backgroundColor === "lightgray") {
                obj.style.backgroundColor = "transparent"; // 원래 상태로 되돌리기
            } else {
                obj.style.backgroundColor = "lightgray"; // 강조 색상으로 변경
            }
        }

        // 4. 숨기기/보이기 토글 함수
        function toggleVisibility() {
            var obj = document.getElementById("target");
            
            // 현재 display 속성 값을 확인
            if (obj.style.display === "none") {
                obj.style.display = "block";
            } else {
                obj.style.display = "none";
            }
        }
        </script>
</section>
</main>
<footer>
  <small>&copy; <span id="year"></span> 이름: 박예인</small>
</footer>
<script src="script.js"></script>
</body>
</html>
