<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>인터넷활용 실습 템플릿</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* 1. 레트로 스타일 체크박스 */
    .menu-check {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #000;
      background-color: #fff;
      cursor: pointer;
      vertical-align: middle;
      position: relative;
      box-shadow: 2px 2px 0px #000;
      margin-right: 8px;
    }
    .menu-check:checked {
      background-color: #000;
    }
    .menu-check:checked::after {
      content: '✔';
      color: #fff;
      font-size: 14px;
      position: absolute;
      top: -2px;
      left: 2px;
      font-weight: bold;
    }
    .menu-item {
      margin-bottom: 12px;
      font-size: 16px;
    }

    /* 2. 합계 박스 규격 조정 */
    .total-wrapper {
      font-size: 18px;
      font-weight: bold;
    }
    #total {
      width: 90px;
      text-align: right;
      padding: 4px 8px;
      font-size: 16px;
      font-weight: bold;
      background-color: #eee;
      border: 2px inset #888;
      margin: 0 5px;
    }
    
    /* [추가] 최소 주문 금액 안내 메시지 스타일 */
    .min-order-msg {
      font-size: 14px;
      margin-top: 8px;
      font-weight: normal;
      height: 20px; /* 고정 높이를 주어 텍스트가 바뀔 때 화면이 덜덜거리지 않게 함 */
    }

    /* 3. 눌리는 느낌의 버튼 스타일 */
    .retro-btn {
      background-color: #ccc;
      border: 2px solid #000;
      border-top-color: #fff;
      border-left-color: #fff;
      padding: 6px 16px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000;
      transition: transform 0.05s, box-shadow 0.05s, background-color 0.2s;
    }
    .retro-btn:active:not(:disabled) { /* 비활성화 상태가 아닐 때만 눌리는 효과 */
      border: 2px solid #000;
      border-bottom-color: #fff;
      border-right-color: #fff;
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #000;
    }

    /* [추가] 비활성화(disabled)된 버튼 스타일 */
    .retro-btn:disabled {
      background-color: #888;
      color: #555;
      cursor: not-allowed; /* 금지 마커 표시 */
      border: 2px solid #555;
      box-shadow: none; /* 그림자를 없애서 튀어나와 보이지 않게 함 */
      transform: translate(2px, 2px); /* 이미 눌려있는 듯한 위치로 고정 */
    }

    /* 우편번호 찾기 등 작은 버튼을 위한 추가 스타일 */
    .small-btn {
      padding: 4px 8px;
      font-size: 13px;
      margin-left: 5px;
      vertical-align: middle;
    }

    /* 입력창 공통 스타일 */
    .addr-input {
      border: 2px solid #888;
      padding: 4px;
      margin-bottom: 5px;
      vertical-align: middle;
    }
    
    /* 레이아웃 간격 조정 */
    .info-group {
      margin-bottom: 10px;
    }
  </style>
  
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body>
<header>
  <h1>이름: 박예인</h1>
  <p class="subtitle">한 줄 소개: 26학번</p>
</header>
<nav>
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="portfolio.html">Portfolio</a>
  <a href="contact.html">Contact</a>
</nav>
<main class="container">
<section>
  <h3>실습 5 : 스마트 피자 주문서</h3>
    <hr>
    
    <form action="#" onsubmit="return validate(event)">
        
        <div id="menu_box">
            <h4>[메뉴 선택]</h4>
            
            <div class="menu-item">
                <label><input type="checkbox" class="menu-check" value="15000" onchange="recalc()"> 콤비네이션 피자 (15,000원)</label>
                <input type="number" class="menu-qty" value="1" min="1" style="width: 40px;" onchange="recalc()" onkeyup="recalc()"> 개
            </div>
            <div class="menu-item">
                <label><input type="checkbox" class="menu-check" value="12000" onchange="recalc()"> 페퍼로니 피자 (12,000원)</label>
                <input type="number" class="menu-qty" value="1" min="1" style="width: 40px;" onchange="recalc()" onkeyup="recalc()"> 개
            </div>
            <div class="menu-item">
                <label><input type="checkbox" class="menu-check" value="9000" onchange="recalc()"> 치즈 오븐 스파게티 (9,000원)</label>
                <input type="number" class="menu-qty" value="1" min="1" style="width: 40px;" onchange="recalc()" onkeyup="recalc()"> 개
            </div>
            <div class="menu-item">
                <label><input type="checkbox" class="menu-check" value="2000" onchange="recalc()"> 치즈 토핑 추가 (2,000원)</label>
                <input type="number" class="menu-qty" value="1" min="1" style="width: 40px;" onchange="recalc()" onkeyup="recalc()"> 개
            </div>
            <div class="menu-item">
                <label><input type="checkbox" class="menu-check" value="1500" onchange="recalc()"> 콜라 1.25L (1,500원)</label>
                <input type="number" class="menu-qty" value="1" min="1" style="width: 40px;" onchange="recalc()" onkeyup="recalc()"> 개
            </div>
        </div>
        <br>

        <div class="total-wrapper">
            주문 합계: <input type="text" id="total" value="0" readonly>원
            <div id="minOrderMsg" class="min-order-msg" style="color: #d32f2f;">최소 주문 금액은 15,000원입니다.</div>
        </div>
        <br>

        <hr>
        
        <h4>[주문자 정보]</h4>

        <div class="info-group">
            <strong>고객명:</strong> 
            <input type="text" id="customerName" class="addr-input" placeholder="이름을 입력하세요">
        </div>

        <div class="info-group">
            <strong>전화번호:</strong> 
            <input type="tel" id="phone" class="addr-input" placeholder="010-0000-0000">
        </div>

        <div class="info-group">
            <strong>배달 주소:</strong><br>
            <input type="text" id="postcode" class="addr-input" placeholder="우편번호" readonly style="width: 100px;"><br>
            <input type="text" id="addr" class="addr-input" placeholder="도로명/지번 주소" readonly style="width: 300px;">
            <input type="button" class="retro-btn small-btn" onclick="execDaumPostcode()" value="우편번호 찾기"><br>
            <input type="text" id="detailAddr" class="addr-input" placeholder="상세주소를 입력해주세요 (예: 101동 202호)" style="width: 300px;">
        </div>
        <br>

        <input type="submit" id="submitBtn" class="retro-btn" value="주문하기" disabled>
        <input type="reset" class="retro-btn" value="초기화" onclick="setTimeout(recalc, 0)">
    </form>
</section>
</main>
<footer>
  <small>&copy; <span id="year"></span> 이름: 박예인</small>
</footer>
<script src="script.js"></script>

<script>
    /* 메뉴 가격 계산 및 최소 주문 금액 제어 */
    function recalc() {
        var total = 0; 
        var minOrder = 15000; // 최소 주문 금액 설정 (15,000원)
        
        var checks = document.getElementsByClassName("menu-check");
        var qtys = document.getElementsByClassName("menu-qty");
        var submitBtn = document.getElementById("submitBtn");
        var msgDiv = document.getElementById("minOrderMsg");

        for (var i = 0; i < checks.length; i++) {
            if (checks[i].checked) { 
                var price = parseInt(checks[i].value);
                var quantity = parseInt(qtys[i].value);
                
                if (isNaN(quantity) || quantity < 1) {
                    quantity = 1;
                }
                total += price * quantity;
            }
        }
        document.getElementById("total").value = total;

        // [추가] 최소 주문 금액 조건 확인 로직
        if (total === 0) {
            msgDiv.innerHTML = "최소 주문 금액은 " + minOrder.toLocaleString() + "원입니다.";
            msgDiv.style.color = "#d32f2f"; // 빨간색
            submitBtn.disabled = true;      // 버튼 비활성화
        } else if (total < minOrder) {
            var diff = minOrder - total;
            msgDiv.innerHTML = "주문하려면 " + diff.toLocaleString() + "원이 더 필요합니다!";
            msgDiv.style.color = "#d32f2f"; // 빨간색
            submitBtn.disabled = true;      // 버튼 비활성화
        } else {
            msgDiv.innerHTML = "🎉 주문 가능한 금액입니다!";
            msgDiv.style.color = "#2e7d32"; // 초록색
            submitBtn.disabled = false;     // 버튼 활성화
        }
    }

    /* 우편번호 검색 API */
    function execDaumPostcode() {
        new daum.Postcode({
            oncomplete: function(data) {
                var addr = ''; 

                if (data.userSelectedType === 'R') { 
                    addr = data.roadAddress;
                } else { 
                    addr = data.jibunAddress;
                }

                document.getElementById('postcode').value = data.zonecode;
                document.getElementById("addr").value = addr;
                
                document.getElementById("detailAddr").focus();
            }
        }).open();
    }

    /* 폼 전송 시 유효성 검사 */
    function validate(e) {
        var total = parseInt(document.getElementById("total").value);
        var customerName = document.getElementById("customerName").value;
        var phone = document.getElementById("phone").value;
        var addr = document.getElementById("addr").value;
        var detailAddr = document.getElementById("detailAddr").value;
        
        // (최소 금액 검사는 버튼 비활성화로 이미 막았으므로 여기서는 생략해도 되지만 2중 체크용으로 남겨둘 수 있습니다)

        if (customerName.trim() == "") {
            alert("고객명을 입력해주세요!");
            document.getElementById("customerName").focus();
            e.preventDefault();
            return false;
        }

        if (phone.trim() == "") {
            alert("전화번호를 입력해주세요!");
            document.getElementById("phone").focus();
            e.preventDefault();
            return false;
        }

        if (addr == "") {
            alert("우편번호 찾기를 통해 배달 주소를 입력해주세요!");
            e.preventDefault();
            return false;
        }

        if (detailAddr.trim() == "") {
            alert("상세 주소(동, 호수 등)를 입력해주세요!");
            document.getElementById("detailAddr").focus();
            e.preventDefault();
            return false;
        }

        alert("주문이 완료되었습니다!\n\n" +
              "- 고객명: " + customerName + "\n" +
              "- 배달주소: " + addr + " " + detailAddr + "\n" +
              "- 총 결제금액: " + total + "원");
              
        e.preventDefault(); 
        return false; 
    }
</script>
</body>
</html>
