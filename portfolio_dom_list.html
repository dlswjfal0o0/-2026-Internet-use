<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>인터넷활용 실습 템플릿</title>
  <link rel="stylesheet" href="style.css">
  <style>
        ul {
        list-style-type: none;
        padding: 0;
     }
       li {
        background-color: #dfdfdf; /* 약간 탁한 옛날 회색 */
        margin: 5px 0;
        padding: 10px;
        border: 2px solid;
        border-color: #ffffff #808080 #808080 #ffffff; /* 컨테이너 입체감 */
        font-family: 'Courier New', Courier, monospace; /* 레트로 폰트 느낌 */
     }
        li:hover {
            background-color: #ffdddd; /* 마우스 올리면 삭제 경고색 */
        }
        /* 레트로 스타일 버튼 */
        button {
        padding: 6px 12px;
        font-size: 14px;
        font-family: 'Courier New', Courier, monospace;
        background-color: #c0c0c0; /* 윈도우 95 기본 회색 */
        color: black;
        cursor: pointer;
        margin-left: 4px;
        
        /* ⭐️ 레트로 버튼의 핵심: 밝고 어두운 테두리로 플라스틱 버튼 느낌 내기 */
        border: 2px solid;
        border-color: #ffffff #000000 #000000 #ffffff; 
        box-shadow: inset 1px 1px #dfdfdf, inset -1px -1px #808080;
     }

    /* 버튼을 클릭(누르고 있을 때)했을 때 쏙 들어가는 효과 */
        button:active {
        border-color: #000000 #ffffff #ffffff #000000;
        box-shadow: inset 1px 1px #808080, inset -1px -1px #dfdfdf;
        /* 글자를 살짝 아래로 내려서 진짜 눌린 것처럼 연출 */
        padding: 7px 11px 5px 13px; 
        }
    </style>
</head>
<body>
<header>
  <h1>이름: 박예인</h1>
  <p class="subtitle">한 줄 소개: 26학번</p>
</header>
<nav>
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="portfolio.html">Portfolio</a>
  <a href="contact.html">Contact</a>
</nav>
<main class="container">
<section>
 <h3>댓글 목록</h3>
 <ul id="commentList"></ul>
 <script>
    function addComment() {
        // 1. 사용자 입력 받기
        var inputStr = prompt("추가할 댓글 내용을 입력하세요:", "오늘 수업 너무 재밌어요!");

        // 취소 버튼을 누르거나 내용이 없으면 종료
        if (inputStr == null || inputStr.trim() == "") {
            return; 
        }

        // 2. 부모 요소(ul) 찾기
        var parent = document.getElementById("commentList");

        // 3. 새로운 요소(li) 생성
        var newLi = document.createElement("li");
        
        // --------------------------------------------------
        // [추가 기능 1] 댓글 내용을 담을 공간 (나중에 수정하기 위해 따로 만듦)
        // --------------------------------------------------
        var textSpan = document.createElement("span");
        textSpan.innerHTML = inputStr + " "; // 입력한 텍스트 넣기

        // --------------------------------------------------
        // [추가 기능 2] 작성 시간 표시 기능
        // --------------------------------------------------
        var timeSpan = document.createElement("span");
        var now = new Date(); // 현재 시간 가져오기
        var timeString = now.toLocaleTimeString(); // 예: "오후 5:33:20" 형태로 변환
        timeSpan.innerHTML = "[" + timeString + "] ";
        timeSpan.style.color = "gray"; // 시간은 회색으로 작게 표시
        timeSpan.style.fontSize = "0.8em";

        // --------------------------------------------------
        // [추가 기능 3] 이모티콘(좋아요) 기능
        // --------------------------------------------------
        var emojiBtn = document.createElement("button");
        var likeCount = 0; // 초기 좋아요 개수
        emojiBtn.innerHTML = "👍 " + likeCount;
        emojiBtn.onclick = function() {
            likeCount++; // 누를 때마다 숫자 1씩 증가
            emojiBtn.innerHTML = "👍 " + likeCount;
        };

        // --------------------------------------------------
        // [추가 기능 4] 댓글 수정 기능
        // --------------------------------------------------
        var editBtn = document.createElement("button");
        editBtn.innerHTML = "수정";
        editBtn.onclick = function() {
            // 현재 텍스트를 기본값으로 띄워주면서 수정할 내용을 입력받음
            var newText = prompt("댓글을 수정하세요:", textSpan.innerHTML.trim());
            // 새로 입력한 값이 있다면 텍스트 업데이트
            if (newText != null && newText.trim() != "") {
                textSpan.innerHTML = newText + " ";
            }
        };

        // --------------------------------------------------
        // [변경됨] 댓글 삭제 기능 (이제 전체 클릭이 아니라 삭제 버튼 클릭 시 작동)
        // --------------------------------------------------
        var deleteBtn = document.createElement("button");
        deleteBtn.innerHTML = "삭제";
        deleteBtn.onclick = function() {
            parent.removeChild(newLi); // 부모(ul)에서 이 줄(li)을 삭제
        };

        // 4. 생성한 요소들을 li 안에 차곡차곡 조립하기 (Append)
        newLi.appendChild(textSpan);  // 댓글 내용
        newLi.appendChild(timeSpan);  // 작성 시간
        newLi.appendChild(emojiBtn);  // 👍 버튼
        newLi.appendChild(editBtn);   // 수정 버튼
        newLi.appendChild(deleteBtn); // 삭제 버튼

        // 5. 완성된 li를 화면(ul)에 추가하기
        parent.appendChild(newLi);
    }
</script>
    <body onload="addComment()"> 
    <!-- 페이지 로드 시 자동으로 한 번 실행되게 하여 가이드라인 충족 -->

    <h3>실습 2: 댓글 추가/삭제 프로그램</h3>
    <p>아래 삭제 버튼을 클릭하면 해당 항목이 삭제됩니다.</p>
    <hr>

    <button onclick="addComment()">+ 댓글 추가하기</button>

    <!-- 댓글이 들어갈 목록 -->
    <ul id="commentList">
        <!-- 자바스크립트로 여기에 li가 추가됩니다 -->
    </ul>

</body>
</section>
</main>
<footer>
  <small>&copy; <span id="year"></span> 이름: 박예인</small>
</footer>
<script src="script.js"></script>
</body>
</html>
